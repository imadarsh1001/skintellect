[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skintellect"
version = "3.0.0"
description = "Explainable cosmetic formulation intelligence & product research platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
    "httpx[socks]>=0.28.1,<1",
    "google-genai>=1.65,<2",
]

[project.optional-dependencies]
dev = ["ruff>=0.14,<1"]

[project.scripts]
skintellect = "skintellect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["skintellect*"]

[tool.setuptools.package-data]
skintellect = [
    "web/templates/*.html",
    "web/static/css/*.css",
    "web/static/js/*.js",
    "web/static/vendor/*.js",
    "research/reference_sources.json",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".runtime", ".test-work", "backups", "data", "reports", "analysis/outputs"]

[tool.ruff.lint]
# Tighten style incrementally; this first gate catches correctness problems.
select = ["E9", "F63", "F7", "F82"]
