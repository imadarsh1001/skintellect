<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skintellect — Science-Grounded Formulation Intelligence</title>
    <meta
      name="description"
      content="Explore verified skin, hair, body and makeup formulations with deterministic skin-profile matching, full INCI transparency, contraindication flags and a science-grounded research copilot."
    />
    <!-- The :root surface is the manila paper (index.css --background). -->
    <meta name="theme-color" content="#F5F1EA" />
    <!-- og:url / og:title / canonical are rewritten per route by the router's
         afterEach (lib/seo.ts); everything below is the shared shell. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Skintellect" />
    <meta property="og:title" content="Skintellect — Science-Grounded Formulation Intelligence" />
    <meta
      property="og:description"
      content="Explore verified cosmetic formulations with deterministic skin-profile matching, full INCI transparency, contraindication flags and a science-grounded research copilot."
    />
    <meta property="og:url" content="https://skintellect.vercel.app/" />
    <meta property="og:image" content="https://skintellect.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Skintellect — Science-Grounded Formulation Intelligence" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Skintellect — Science-Grounded Formulation Intelligence" />
    <meta
      name="twitter:description"
      content="Explore verified cosmetic formulations with deterministic skin-profile matching, full INCI transparency and contraindication flags."
    />
    <meta name="twitter:image" content="https://skintellect.vercel.app/og-image.png" />
  </head>
  <body class="min-h-screen bg-background font-sans antialiased text-foreground">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
