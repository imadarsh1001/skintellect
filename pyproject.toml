[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skintellect"
version = "3.0.0"
description = "Explainable cosmetic product research and recommendation application"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["ruff>=0.14,<1"]

[project.scripts]
skintellect = "skintellect.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
include = ["skintellect*"]

[tool.setuptools.package-data]
skintellect = ["web/templates/*.html", "web/static/css/*.css", "web/static/js/*.js", "web/static/vendor/*.js", "research/reference_sources.json"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".runtime", ".test-work", "backups", "data", "reports", "analysis/outputs"]

[tool.ruff.lint]
# Tighten style incrementally; this first gate catches correctness problems.
select = ["E9", "F63", "F7", "F82"]
